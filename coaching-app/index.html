<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Coaching Dashboard</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --text: #111827;
      --text-muted: #6b7280;
      --green: #059669;
      --green-bg: #ecfdf5;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --yellow: #d97706;
      --yellow-bg: #fffbeb;
      --blue: #2563eb;
      --blue-bg: #eff6ff;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 { font-size: 17px; font-weight: 700; color: var(--primary); }
    .sidebar-header p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .sidebar-nav { padding: 12px; }

    .nav-btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: transparent;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      margin-bottom: 2px;
      transition: background 0.1s;
    }

    .nav-btn:hover { background: var(--bg); }
    .nav-btn.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

    .nav-label {
      padding: 16px 14px 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .agent-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }

    .agent-item {
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      transition: background 0.1s;
    }

    .agent-item:hover { background: var(--bg); }
    .agent-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

    .agent-item .remove-btn {
      opacity: 0;
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 16px;
      padding: 0 2px;
      line-height: 1;
    }

    .agent-item:hover .remove-btn { opacity: 0.6; }
    .agent-item .remove-btn:hover { opacity: 1; }

    .btn-add-agent {
      margin: 0 12px 12px;
      padding: 9px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add-agent:hover { background: var(--primary-hover); }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .topbar {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h2 { font-size: 18px; font-weight: 700; }

    .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

    /* ── Week Filter ── */
    .week-filter {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .week-filter label { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    .week-filter input[type="week"],
    .week-filter select {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }

    /* ── Stat Cards ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .stat-card .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── Agent Table (Dashboard) ── */
    .agents-table {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
    }

    .agents-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .agents-table td {
      padding: 12px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    .agents-table tr:last-child td { border-bottom: none; }

    .agents-table tr:hover td { background: #f9fafb; }

    .agents-table .name-link {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .agents-table .name-link:hover { text-decoration: underline; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
    .badge-red { background: var(--red-bg); color: var(--red); }
    .badge-blue { background: var(--blue-bg); color: var(--blue); }

    /* ── Progress Bar ── */
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }

    /* ── Agent Profile ── */
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .profile-header h3 { font-size: 20px; font-weight: 700; }
    .profile-header .meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    /* ── Upload Area ── */
    .upload-area {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 24px;
    }

    .upload-area:hover { border-color: var(--primary); background: var(--primary-light); }
    .upload-area.dragover { border-color: var(--primary); background: var(--primary-light); }
    .upload-area .icon { font-size: 36px; color: var(--text-muted); }
    .upload-area p { font-size: 14px; color: var(--text-muted); margin-top: 8px; }
    .upload-area .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* ── Call Cards ── */
    .call-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
    }

    .call-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .call-card-header .date { font-weight: 600; font-size: 14px; }

    .call-card-toggle {
      background: none;
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--primary);
    }

    .call-card-toggle:hover { background: var(--primary-light); }

    .call-card .outcome-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .call-card .analysis {
      background: var(--bg);
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      max-height: none;
      overflow-y: visible;
    }

    /* ── Analysis Report ── */
    .report { font-size: 14px; }

    .report-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .overall-score-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-weight: 800;
      font-size: 22px;
      flex-shrink: 0;
      border: 4px solid;
    }

    .overall-score-ring .label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    .report-header-text h4 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .report-header-text p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

    .report-scores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .score-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .score-card-header .title { font-weight: 700; font-size: 13px; }
    .score-card-header .score { font-weight: 800; font-size: 15px; }

    .score-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .score-bar .fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .score-card .assessment { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    .report-section {
      margin-bottom: 20px;
    }

    .report-section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .report-section-title .icon { font-size: 16px; }

    /* Transcript excerpt cards */
    .excerpt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--red);
      border-radius: 0 8px 8px 0;
      padding: 14px;
      margin-bottom: 10px;
    }

    .excerpt-card.strength {
      border-left-color: var(--green);
    }

    .excerpt-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .excerpt-label.issue { color: var(--red); }
    .excerpt-label.good { color: var(--green); }
    .excerpt-label.nepq { color: var(--primary); }

    .excerpt-quote {
      background: #fef2f2;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      font-style: italic;
      color: #7f1d1d;
      margin-bottom: 8px;
    }

    .excerpt-card.strength .excerpt-quote {
      background: #ecfdf5;
      color: #064e3b;
    }

    .excerpt-rewrite {
      background: #eff6ff;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #1e3a5f;
      margin-bottom: 8px;
    }

    .excerpt-rewrite::before {
      content: "Better approach: ";
      font-weight: 700;
      color: var(--primary);
    }

    .excerpt-explanation {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .nepq-tag {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-left: 6px;
    }

    .strength-item, .improvement-item {
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .strength-item { border-left: 3px solid var(--green); }
    .improvement-item { border-left: 3px solid var(--yellow); }

    .coaching-box {
      background: var(--primary-light);
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: #312e81;
    }

    .coaching-box strong { color: var(--primary); }

    .call-card .transcript-preview {
      background: var(--bg);
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .call-card .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .call-card .delete-call {
      background: none;
      border: none;
      color: var(--red);
      font-size: 12px;
      cursor: pointer;
      opacity: 0.6;
    }

    .call-card .delete-call:hover { opacity: 1; }

    /* ── Outcome Selector (modal-style) ── */
    .outcome-select {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .outcome-btn {
      padding: 5px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface);
      transition: all 0.1s;
    }

    .outcome-btn:hover { border-color: var(--primary); color: var(--primary); }
    .outcome-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── Buttons ── */
    .btn {
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface);
      transition: all 0.15s;
    }

    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    /* ── Loading Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty State ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 8px;
    }

    .empty-state .icon { font-size: 48px; opacity: 0.25; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
      .agent-list { max-height: 120px; }
      .main { height: auto; min-height: calc(100vh - 200px); }
      .content { padding: 16px; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .profile-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Sales Coach</h1>
      <p>Call Analysis Dashboard</p>
    </div>
    <div class="sidebar-nav">
      <button class="nav-btn active" id="navDashboard" onclick="goToDashboard()">Dashboard</button>
    </div>
    <div class="nav-label">Agents</div>
    <div class="agent-list" id="agentList"></div>
    <button class="btn-add-agent" onclick="addAgent()">+ Add Agent</button>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar" id="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <div id="topbarRight"></div>
    </div>
    <div class="content" id="content"></div>
  </main>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.doc,.docx,.pdf" multiple style="display:none" />

  <script>
    // ════════════════════════════════════════
    //  DATA LAYER
    // ════════════════════════════════════════
    const STORAGE_KEY = "sales_coaching_v2";

    function loadData() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { agents: [] }; }
      catch { return { agents: [] }; }
    }

    function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

    let data = loadData();
    let view = "dashboard"; // "dashboard" | "agent"
    let activeAgentId = null;
    let weekFilter = getCurrentWeek();

    function getCurrentWeek() {
      const d = new Date();
      const day = d.getDay() || 7;
      d.setDate(d.getDate() + 4 - day);
      const year = d.getFullYear();
      const week = Math.ceil((((d - new Date(year, 0, 1)) / 86400000) + 1) / 7);
      return `${year}-W${String(week).padStart(2, '0')}`;
    }

    function getWeekRange(weekStr) {
      if (!weekStr) return null;
      const [y, w] = weekStr.split("-W").map(Number);
      const jan1 = new Date(y, 0, 1);
      const days = (w - 1) * 7;
      const start = new Date(jan1);
      start.setDate(jan1.getDate() + days - ((jan1.getDay() + 6) % 7));
      start.setHours(0, 0, 0, 0);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function filterCallsByWeek(calls, weekStr) {
      if (!weekStr || weekStr === "all") return calls;
      const range = getWeekRange(weekStr);
      if (!range) return calls;
      return calls.filter(c => {
        const d = new Date(c.date);
        return d >= range.start && d <= range.end;
      });
    }

    function getAgent(id) { return data.agents.find(a => a.id === id); }

    // ════════════════════════════════════════
    //  AGENT MANAGEMENT
    // ════════════════════════════════════════
    function addAgent() {
      const name = prompt("Agent name:");
      if (!name || !name.trim()) return;
      const agent = {
        id: Date.now().toString(),
        name: name.trim(),
        calls: [],
        createdAt: new Date().toISOString(),
      };
      data.agents.push(agent);
      saveData(data);
      renderSidebar();
      goToAgent(agent.id);
    }

    function deleteAgent(id, e) {
      e.stopPropagation();
      if (!confirm("Delete this agent and all their call data?")) return;
      data.agents = data.agents.filter(a => a.id !== id);
      saveData(data);
      if (activeAgentId === id) goToDashboard();
      renderSidebar();
    }

    // ════════════════════════════════════════
    //  NAVIGATION
    // ════════════════════════════════════════
    function goToDashboard() {
      view = "dashboard";
      activeAgentId = null;
      renderSidebar();
      render();
    }

    function goToAgent(id) {
      view = "agent";
      activeAgentId = id;
      renderSidebar();
      render();
    }

    // ════════════════════════════════════════
    //  SIDEBAR
    // ════════════════════════════════════════
    function renderSidebar() {
      document.getElementById("navDashboard").classList.toggle("active", view === "dashboard");
      const el = document.getElementById("agentList");
      el.innerHTML = data.agents.map(a => `
        <div class="agent-item ${a.id === activeAgentId ? 'active' : ''}" onclick="goToAgent('${a.id}')">
          <span>${esc(a.name)}</span>
          <button class="remove-btn" onclick="deleteAgent('${a.id}', event)" title="Remove">&times;</button>
        </div>
      `).join("");
    }

    // ════════════════════════════════════════
    //  MAIN RENDER
    // ════════════════════════════════════════
    function render() {
      if (view === "dashboard") renderDashboard();
      else renderAgentProfile();
    }

    // ════════════════════════════════════════
    //  DASHBOARD VIEW
    // ════════════════════════════════════════
    function renderDashboard() {
      const titleEl = document.getElementById("pageTitle");
      const rightEl = document.getElementById("topbarRight");
      const content = document.getElementById("content");

      titleEl.textContent = "Dashboard";
      rightEl.innerHTML = `
        <div class="week-filter">
          <label>Week:</label>
          <input type="week" id="dashWeek" value="${weekFilter}" onchange="weekFilter=this.value;render()" />
          <button class="btn btn-sm" onclick="weekFilter='all';document.getElementById('dashWeek').value='';render()">All Time</button>
        </div>
      `;

      if (data.agents.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">&#128101;</div>
            <h3>No agents yet</h3>
            <p>Click "+ Add Agent" to get started.</p>
          </div>
        `;
        return;
      }

      // Calculate totals
      let totalCalls = 0, totalBooked = 0, totalClosed = 0, totalNoShow = 0;
      const agentRows = data.agents.map(a => {
        const calls = filterCallsByWeek(a.calls, weekFilter);
        const booked = calls.filter(c => c.outcome === "booked" || c.outcome === "closed").length;
        const closed = calls.filter(c => c.outcome === "closed").length;
        const noShow = calls.filter(c => c.outcome === "no-show").length;
        const ratio = calls.length > 0 ? Math.round((closed / calls.length) * 100) : 0;
        totalCalls += calls.length;
        totalBooked += booked;
        totalClosed += closed;
        totalNoShow += noShow;
        return { agent: a, calls: calls.length, booked, closed, noShow, ratio };
      });

      const overallRatio = totalCalls > 0 ? Math.round((totalClosed / totalCalls) * 100) : 0;
      const bookToCloseRate = totalBooked > 0 ? Math.round((totalClosed / totalBooked) * 100) : 0;

      content.innerHTML = `
        <div class="stats-row">
          <div class="stat-card">
            <div class="label">Total Calls</div>
            <div class="value">${totalCalls}</div>
            <div class="sub">${weekFilter === 'all' ? 'All time' : 'This week'}</div>
          </div>
          <div class="stat-card">
            <div class="label">Booked</div>
            <div class="value">${totalBooked}</div>
            <div class="sub">Appointments set</div>
          </div>
          <div class="stat-card">
            <div class="label">Closed</div>
            <div class="value" style="color:var(--green)">${totalClosed}</div>
            <div class="sub">Deals won</div>
          </div>
          <div class="stat-card">
            <div class="label">Book-to-Close</div>
            <div class="value" style="color:var(--primary)">${bookToCloseRate}%</div>
            <div class="sub">Closing rate from booked</div>
          </div>
        </div>

        <table class="agents-table">
          <thead>
            <tr>
              <th>Agent</th>
              <th>Calls</th>
              <th>Booked</th>
              <th>Closed</th>
              <th>No-Show</th>
              <th>Close Rate</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody>
            ${agentRows.map(r => `
              <tr>
                <td><span class="name-link" onclick="goToAgent('${r.agent.id}')">${esc(r.agent.name)}</span></td>
                <td>${r.calls}</td>
                <td>${r.booked}</td>
                <td><strong style="color:var(--green)">${r.closed}</strong></td>
                <td>${r.noShow}</td>
                <td><span class="badge ${r.ratio >= 50 ? 'badge-green' : r.ratio >= 25 ? 'badge-yellow' : 'badge-red'}">${r.ratio}%</span></td>
                <td style="min-width:120px">
                  <div class="progress-bar">
                    <div class="fill" style="width:${r.ratio}%;background:${r.ratio >= 50 ? 'var(--green)' : r.ratio >= 25 ? 'var(--yellow)' : 'var(--red)'}"></div>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    // ════════════════════════════════════════
    //  AGENT PROFILE VIEW
    // ════════════════════════════════════════
    function renderAgentProfile() {
      const agent = getAgent(activeAgentId);
      if (!agent) { goToDashboard(); return; }

      const titleEl = document.getElementById("pageTitle");
      const rightEl = document.getElementById("topbarRight");
      const content = document.getElementById("content");

      titleEl.textContent = agent.name;
      rightEl.innerHTML = `
        <div class="week-filter">
          <label>Week:</label>
          <input type="week" id="agentWeek" value="${weekFilter}" onchange="weekFilter=this.value;render()" />
          <button class="btn btn-sm" onclick="weekFilter='all';document.getElementById('agentWeek').value='';render()">All Time</button>
        </div>
      `;

      const calls = filterCallsByWeek(agent.calls, weekFilter);
      const booked = calls.filter(c => c.outcome === "booked" || c.outcome === "closed").length;
      const closed = calls.filter(c => c.outcome === "closed").length;
      const noShow = calls.filter(c => c.outcome === "no-show").length;
      const pending = calls.filter(c => !c.outcome).length;
      const ratio = calls.length > 0 ? Math.round((closed / calls.length) * 100) : 0;
      const bookToClose = booked > 0 ? Math.round((closed / booked) * 100) : 0;

      content.innerHTML = `
        <div class="profile-stats">
          <div class="stat-card">
            <div class="label">Total Calls</div>
            <div class="value">${calls.length}</div>
          </div>
          <div class="stat-card">
            <div class="label">Booked</div>
            <div class="value">${booked}</div>
          </div>
          <div class="stat-card">
            <div class="label">Closed</div>
            <div class="value" style="color:var(--green)">${closed}</div>
          </div>
          <div class="stat-card">
            <div class="label">Book-to-Close</div>
            <div class="value" style="color:var(--primary)">${bookToClose}%</div>
          </div>
          <div class="stat-card">
            <div class="label">No-Show</div>
            <div class="value" style="color:var(--yellow)">${noShow}</div>
          </div>
          <div class="stat-card">
            <div class="label">Close Rate</div>
            <div class="value">${ratio}%</div>
            <div class="progress-bar" style="margin-top:6px">
              <div class="fill" style="width:${ratio}%;background:${ratio >= 50 ? 'var(--green)' : ratio >= 25 ? 'var(--yellow)' : 'var(--red)'}"></div>
            </div>
          </div>
        </div>

        <!-- Upload Area -->
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
          <div class="icon">&#128196;</div>
          <p><strong>Upload Call Transcripts</strong></p>
          <p class="hint">Drop .txt files here or click to browse. Each file = one call.</p>
        </div>

        <!-- Call List -->
        <h3 style="font-size:15px;font-weight:700;margin-bottom:14px;">
          Calls (${calls.length})
        </h3>
        <div id="callList"></div>
      `;

      // Render calls
      renderCallList(calls);

      // Setup drag & drop
      setupUpload(agent.id);
    }

    function renderCallList(calls) {
      const el = document.getElementById("callList");
      if (!el) return;

      if (calls.length === 0) {
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:32px;">No calls yet. Upload a transcript to get started.</p>';
        return;
      }

      const sorted = [...calls].sort((a, b) => b.date.localeCompare(a.date));
      el.innerHTML = sorted.map(c => {
        const outcomes = ["booked", "closed", "no-show", "not-interested", "callback"];
        return `
          <div class="call-card" id="call-${c.id}">
            <div class="call-card-header">
              <span class="date">${c.date} &nbsp; <span style="font-weight:400;color:var(--text-muted);font-size:12px;">${esc(c.fileName || 'transcript')}</span></span>
              <div style="display:flex;gap:6px;align-items:center;">
                ${c.outcome ? `<span class="badge ${outcomeBadgeClass(c.outcome)}">${c.outcome}</span>` : '<span style="font-size:12px;color:var(--text-muted)">Set outcome:</span>'}
              </div>
            </div>
            <div class="outcome-select">
              ${outcomes.map(o => `
                <button class="outcome-btn ${c.outcome === o ? 'selected' : ''}" onclick="setOutcome('${c.id}','${o}')">${o}</button>
              `).join("")}
            </div>
            ${c.analysis ? `
              <div style="margin-top:12px;">
                <button class="call-card-toggle" onclick="toggleSection('analysis-${c.id}')">Toggle Analysis</button>
                <button class="call-card-toggle" onclick="toggleSection('transcript-${c.id}')">Toggle Transcript</button>
                <button class="call-card-toggle" onclick="reanalyzeCall('${c.id}')" style="margin-left:4px;color:var(--text-muted);">Re-analyze</button>
                <div id="analysis-${c.id}" style="margin-top:8px;">${renderAnalysisReport(c.analysis)}</div>
                <div class="transcript-preview" id="transcript-${c.id}" style="display:none;margin-top:8px;">${esc(c.transcript)}</div>
              </div>
            ` : `
              <div style="margin-top:12px;">
                <button class="btn btn-primary btn-sm" id="analyzeBtn-${c.id}" onclick="analyzeCall('${c.id}')">
                  Analyze Transcript
                </button>
                <button class="call-card-toggle" onclick="toggleSection('transcript-${c.id}')" style="margin-left:6px;">Toggle Transcript</button>
                <div class="transcript-preview" id="transcript-${c.id}" style="display:none;margin-top:8px;">${esc(c.transcript)}</div>
              </div>
            `}
            <div class="actions">
              <button class="delete-call" onclick="deleteCall('${c.id}')">Delete call</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function outcomeBadgeClass(outcome) {
      switch (outcome) {
        case "closed": return "badge-green";
        case "booked": return "badge-blue";
        case "no-show": return "badge-yellow";
        case "not-interested": return "badge-red";
        case "callback": return "badge-blue";
        default: return "";
      }
    }

    function toggleSection(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = el.style.display === "none" ? "block" : "none";
    }

    function setOutcome(callId, outcome) {
      const agent = getAgent(activeAgentId);
      if (!agent) return;
      const call = agent.calls.find(c => c.id === callId);
      if (!call) return;
      call.outcome = call.outcome === outcome ? null : outcome;
      saveData(data);
      render();
    }

    function deleteCall(callId) {
      const agent = getAgent(activeAgentId);
      if (!agent) return;
      agent.calls = agent.calls.filter(c => c.id !== callId);
      saveData(data);
      render();
    }

    // ════════════════════════════════════════
    //  FILE UPLOAD
    // ════════════════════════════════════════
    function setupUpload(agentId) {
      const area = document.getElementById("uploadArea");
      const input = document.getElementById("fileInput");

      area.addEventListener("dragover", e => { e.preventDefault(); area.classList.add("dragover"); });
      area.addEventListener("dragleave", () => area.classList.remove("dragover"));
      area.addEventListener("drop", e => {
        e.preventDefault();
        area.classList.remove("dragover");
        handleFiles(e.dataTransfer.files, agentId);
      });

      input.onchange = () => {
        handleFiles(input.files, agentId);
        input.value = "";
      };
    }

    function handleFiles(files, agentId) {
      const agent = getAgent(agentId);
      if (!agent) return;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const transcript = e.target.result;
          agent.calls.push({
            id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
            date: new Date().toISOString().slice(0, 10),
            fileName: file.name,
            transcript,
            analysis: null,
            outcome: null,
          });
          saveData(data);
          render();
        };
        reader.readAsText(file);
      });
    }

    // ════════════════════════════════════════
    //  TRANSCRIPT ANALYSIS (Claude API)
    // ════════════════════════════════════════
    const ANALYSIS_INSTRUCTIONS = `Sales coach using NEPQ (Jeremy Miner). Return ONLY valid JSON, no markdown.

NEPQ: Connection (trust/rapport), Situation (current state), Problem Awareness (discover pain), Solution Awareness (see the fix), Consequence (cost of inaction), Commitment (trial close).

Score 1-10 each. Quote EXACT transcript words for improvements and rewrites.

JSON format:
{"overallScore":0,"maxScore":70,"summary":"1-2 sentences","categories":[{"name":"Connection & Rapport","score":0,"maxScore":10,"assessment":"brief"},{"name":"Situation Questions","score":0,"maxScore":10,"assessment":"brief"},{"name":"Problem Awareness","score":0,"maxScore":10,"assessment":"brief"},{"name":"Solution Awareness","score":0,"maxScore":10,"assessment":"brief"},{"name":"Objection Handling","score":0,"maxScore":10,"assessment":"brief"},{"name":"Closing & Commitment","score":0,"maxScore":10,"assessment":"brief"},{"name":"Tone & Listening","score":0,"maxScore":10,"assessment":"brief"}],"excerpts":[{"type":"improvement","label":"issue label","quote":"exact transcript words","rewrite":"NEPQ phrasing","nepqPrinciple":"principle name","explanation":"why better"}],"strengths":[{"quote":"exact words","explanation":"why effective"}],"coaching":"specific NEPQ techniques, phrases to use, what to stop/start doing"}`;

    async function analyzeCall(callId) {
      const agent = getAgent(activeAgentId);
      if (!agent) return;
      const call = agent.calls.find(c => c.id === callId);
      if (!call) return;

      const btn = document.getElementById(`analyzeBtn-${callId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Analyzing with NEPQ framework...';
      }

      try {
        // Truncate transcript to ~6000 chars to keep request fast
        let transcript = call.transcript;
        if (transcript.length > 6000) {
          transcript = transcript.substring(0, 6000) + "\n\n[...transcript truncated for analysis]";
        }

        const res = await fetch("/api/claude", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-haiku-4-5-20251001",
            max_tokens: 1500,
            system: ANALYSIS_INSTRUCTIONS,
            messages: [{ role: "user", content: `Analyze this call transcript:\n\n${transcript}` }],
          }),
        });

        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          throw new Error(`Server returned status ${res.status}: ${text.substring(0, 200)}`);
        }

        if (json.content && json.content[0]) {
          // Store raw JSON analysis
          call.analysis = cleanJsonString(json.content[0].text);
        } else if (json.error) {
          call.analysis = JSON.stringify({ error: json.error.message || JSON.stringify(json.error) });
        } else {
          call.analysis = JSON.stringify({ error: "Unexpected response format." });
        }
      } catch (err) {
        call.analysis = JSON.stringify({ error: "Failed to analyze: " + err.message });
      }

      saveData(data);
      render();
    }

    // ════════════════════════════════════════
    //  ANALYSIS REPORT RENDERER
    // ════════════════════════════════════════
    function scoreColor(score, max) {
      const pct = (score / max) * 100;
      if (pct >= 70) return "var(--green)";
      if (pct >= 40) return "var(--yellow)";
      return "var(--red)";
    }

    function cleanJsonString(str) {
      // Strip markdown code fences that AI sometimes wraps around JSON
      let s = str.trim();
      s = s.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '');
      return s.trim();
    }

    function renderAnalysisReport(analysisStr) {
      let report;
      try {
        report = JSON.parse(cleanJsonString(analysisStr));
      } catch {
        // Fallback for old plain-text analyses or errors
        return `<div class="analysis" style="white-space:pre-wrap;">${esc(analysisStr)}</div>`;
      }

      if (report.error) {
        return `<div style="color:var(--red);padding:12px;background:var(--red-bg);border-radius:8px;font-size:13px;">Error: ${esc(report.error)}</div>`;
      }

      const pct = Math.round((report.overallScore / report.maxScore) * 100);
      const color = scoreColor(report.overallScore, report.maxScore);

      let html = `<div class="report">`;

      // Header with overall score
      html += `
        <div class="report-header">
          <div class="overall-score-ring" style="border-color:${color};color:${color};">
            ${report.overallScore}
            <span class="label">/ ${report.maxScore}</span>
          </div>
          <div class="report-header-text">
            <h4>NEPQ Analysis Report</h4>
            <p>${esc(report.summary || '')}</p>
          </div>
        </div>`;

      // Score cards grid
      if (report.categories && report.categories.length) {
        html += `<div class="report-scores">`;
        for (const cat of report.categories) {
          const catPct = Math.round((cat.score / cat.maxScore) * 100);
          const catColor = scoreColor(cat.score, cat.maxScore);
          html += `
            <div class="score-card">
              <div class="score-card-header">
                <span class="title">${esc(cat.name)}</span>
                <span class="score" style="color:${catColor}">${cat.score}/${cat.maxScore}</span>
              </div>
              <div class="score-bar">
                <div class="fill" style="width:${catPct}%;background:${catColor};"></div>
              </div>
              <div class="assessment">${esc(cat.assessment || '')}</div>
            </div>`;
        }
        html += `</div>`;
      }

      // Transcript excerpts - improvements
      if (report.excerpts && report.excerpts.length) {
        html += `
          <div class="report-section">
            <div class="report-section-title">
              <span class="icon">&#9888;&#65039;</span> Transcript Moments to Improve
            </div>`;
        for (const ex of report.excerpts) {
          html += `
            <div class="excerpt-card">
              <div class="excerpt-label issue">${esc(ex.label || 'Needs improvement')}${ex.nepqPrinciple ? `<span class="nepq-tag">${esc(ex.nepqPrinciple)}</span>` : ''}</div>
              <div class="excerpt-quote">"${esc(ex.quote || '')}"</div>
              <div class="excerpt-rewrite">${esc(ex.rewrite || '')}</div>
              <div class="excerpt-explanation">${esc(ex.explanation || '')}</div>
            </div>`;
        }
        html += `</div>`;
      }

      // Strengths
      if (report.strengths && report.strengths.length) {
        html += `
          <div class="report-section">
            <div class="report-section-title">
              <span class="icon">&#9989;</span> What Worked Well
            </div>`;
        for (const s of report.strengths) {
          html += `
            <div class="excerpt-card strength">
              <div class="excerpt-label good">Strength</div>
              <div class="excerpt-quote">"${esc(s.quote || '')}"</div>
              <div class="excerpt-explanation">${esc(s.explanation || '')}</div>
            </div>`;
        }
        html += `</div>`;
      }

      // Coaching recommendation
      if (report.coaching) {
        html += `
          <div class="report-section">
            <div class="report-section-title">
              <span class="icon">&#127919;</span> NEPQ Coaching Recommendation
            </div>
            <div class="coaching-box">${esc(report.coaching)}</div>
          </div>`;
      }

      html += `</div>`;
      return html;
    }

    function reanalyzeCall(callId) {
      const agent = getAgent(activeAgentId);
      if (!agent) return;
      const call = agent.calls.find(c => c.id === callId);
      if (!call) return;
      if (!confirm("Re-analyze this call? This will replace the current analysis.")) return;
      call.analysis = null;
      saveData(data);
      render();
      // Auto-trigger analysis
      setTimeout(() => analyzeCall(callId), 100);
    }

    // ════════════════════════════════════════
    //  UTILITIES
    // ════════════════════════════════════════
    function esc(str) {
      if (!str) return "";
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // ════════════════════════════════════════
    //  INIT
    // ════════════════════════════════════════
    renderSidebar();
    render();
  </script>
</body>
</html>
